<div class="faceswap-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Face Swap (on-device)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <label class="checkbox_label" for="fs_enabled">
                <input id="fs_enabled" type="checkbox">
                <span>Auto-swap generated images</span>
            </label>

            <label for="fs_ref_file">Reference face (the face that gets pasted in)</label>
            <div class="fs-row">
                <input id="fs_ref_file" type="file" accept="image/*">
                <div id="fs_ref_clear" class="menu_button">Clear</div>
            </div>
            <img id="fs_ref_preview" class="fs-preview" alt="" style="display:none">
            <small class="fs-status">Only swap faces you have consent to use. All processing stays on-device.</small>

            <hr>

            <label for="fs_models_path">Models folder (local override, optional)</label>
            <input id="fs_models_path" class="text_pole" type="text">

            <label for="fs_remote_base">Remote models base (one-click download)</label>
            <input id="fs_remote_base" class="text_pole" type="text">
            <div class="fs-row">
                <div id="fs_predownload" class="menu_button">Download models</div>
            </div>
            <small id="fs_dl_status" class="fs-status"></small>

            <div class="fs-grid">
                <div>
                    <label for="fs_det_file">Detector</label>
                    <input id="fs_det_file" class="text_pole" type="text">
                </div>
                <div>
                    <label for="fs_arc_file">ArcFace</label>
                    <input id="fs_arc_file" class="text_pole" type="text">
                </div>
                <div>
                    <label for="fs_swap_file">Swapper</label>
                    <input id="fs_swap_file" class="text_pole" type="text">
                </div>
                <div>
                    <label for="fs_emap_file">emap.bin</label>
                    <input id="fs_emap_file" class="text_pole" type="text">
                </div>
                <div>
                    <label for="fs_enh_file">Enhancer</label>
                    <input id="fs_enh_file" class="text_pole" type="text">
                </div>
                <div>
                    <label for="fs_provider">Runtime</label>
                    <select id="fs_provider" class="text_pole">
                        <option value="webgpu">WebGPU (fallback WASM)</option>
                        <option value="wasm">WASM only</option>
                    </select>
                </div>
            </div>

            <hr>

            <label class="checkbox_label" for="fs_color">
                <input id="fs_color" type="checkbox">
                <span>Colour match (Reinhard, Lab)</span>
            </label>
            <label class="checkbox_label" for="fs_enhance">
                <input id="fs_enhance" type="checkbox">
                <span>Light face enhance (GFPGAN)</span>
            </label>
            <label for="fs_enh_weight">Enhance weight: <span id="fs_enh_weight_val"></span></label>
            <input id="fs_enh_weight" type="range" min="0" max="1" step="0.05">

            <label class="checkbox_label" for="fs_all_faces">
                <input id="fs_all_faces" type="checkbox">
                <span>Swap every face (otherwise largest only)</span>
            </label>
            <label class="checkbox_label" for="fs_identity">
                <input id="fs_identity" type="checkbox">
                <span>Warn when identity match is low (cosine &lt; 0.4)</span>
            </label>

            <div class="fs-grid">
                <div>
                    <label for="fs_min_face">Min face size (px)</label>
                    <input id="fs_min_face" class="text_pole" type="number" min="16" max="512">
                </div>
                <div>
                    <label for="fs_max_side">Max image side (px)</label>
                    <input id="fs_max_side" class="text_pole" type="number" min="256" max="2048">
                </div>
            </div>

            <div id="fs_test" class="menu_button">Run on last generated image</div>
        </div>
    </div>
</div>
